services:
  - type: web
    name: jelajah-travel
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jelajah-db
          property: connectionString
      - key: PG_POOL_MAX
        value: "5"
databases:
  - name: jelajah-db
    databaseName: jelajah
    user: jelajah_app
    plan: free
    region: singapore
    postgresMajorVersion: "16"
